<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engineering & MLOps Stack</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #0d1117;
    color: white;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.table-container {
    overflow: auto;
    max-height: 80vh;
    border: 1px solid #30363d;
}

table {
    border-collapse: separate;
    border-spacing: 0;
    min-width: 1200px;
}

th, td {
    padding: 10px;
    border-right: 1px solid #30363d;
    border-bottom: 1px solid #30363d;
    text-align: center;
    white-space: nowrap;
    background: #0d1117;
}

/* Top border + left border */
tr:first-child th {
    border-top: 1px solid #30363d;
}
th:first-child,
td:first-child {
    border-left: 1px solid #30363d;
}

/* Sticky header */
thead th {
    position: sticky;
    top: 0;
    background: #161b22;
    z-index: 4;
}

/* First column */
th:first-child,
td:first-child {
    position: sticky;
    left: 0;
    width: 150px;
    min-width: 150px;
    max-width: 150px;
    background: #161b22;
    z-index: 3;
    text-align: left;
}

/* Second column */
th:nth-child(2),
td:nth-child(2) {
    position: sticky;
    left: 150px;
    width: 180px;
    min-width: 180px;
    max-width: 180px;
    background: #161b22;
    z-index: 3;
    text-align: left;
}

/* Top-left corner priority */
thead th:first-child,
thead th:nth-child(2) {
    z-index: 5;
}

/* Hover effect */
tbody tr:hover td {
    background: #21262d;
}

/* Keep sticky columns darker on hover */
tbody tr:hover td:first-child,
tbody tr:hover td:nth-child(2) {
    background: #1b222c;
}
</style>

</head>
<body>

<h1>Engineering & MLOps Stack</h1>

<div class="table-container">
<table>

<thead>
<tr>
<th>Category</th>
<th>Tool</th>
<th>Project 1</th>
<th>Project 2</th>
<th>Project 3</th>
<th>Project 4</th>
</tr>
</thead>

<tbody>

<tr>
<td>Data</td>
<td>Pandas</td>
<td>✔️</td>
<td>✔️</td>
<td>✔️</td>
<td>✔️</td>
</tr>

<tr>
<td>ML</td>
<td>Scikit-learn</td>
<td>✔️</td>
<td>✔️</td>
<td>✔️</td>
<td>✔️</td>
</tr>

<tr>
<td>MLOps</td>
<td>MLflow</td>
<td>✔️</td>
<td>❌</td>
<td>✔️</td>
<td>✔️</td>
</tr>

<tr>
<td>API</td>
<td>FastAPI</td>
<td>✔️</td>
<td>✔️</td>
<td>❌</td>
<td>✔️</td>
</tr>

<tr>
<td>Container</td>
<td>Docker</td>
<td>✔️</td>
<td>✔️</td>
<td>✔️</td>
<td>✔️</td>
</tr>

</tbody>

</table>
</div>

</body>
</html>
